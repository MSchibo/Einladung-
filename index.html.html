<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Na, Gem? 💎</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;font-family:system-ui;background:linear-gradient(145deg,#fce8ef,#e9e9fa);color:#51404a}.card{width:min(100%,420px);padding:28px 22px;border-radius:26px;background:#ffffffed;box-shadow:0 18px 50px #89566c24;text-align:center}.gem{font-size:44px}h1{font-family:Georgia;color:#a95678}p{line-height:1.6}button{border:0;border-radius:30px;padding:13px 18px;margin:7px 4px;font-size:15px;font-weight:650;cursor:pointer}.yes{background:#c97898;color:white}.no{background:#f2e8ed;color:#76596a;position:relative}.hidden{display:none}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.date{background:white;border:1px solid #ead7e0;color:#51404a;margin:0}.selected{background:#fbeaf0;border:2px solid #c97898}.small{font-size:13px;color:#927e88}label{display:block;text-align:left;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ead7e0;border-radius:12px;font:inherit}#result{background:#fff4f8;border-radius:14px;padding:12px;margin-top:14px}
</style></head><body><main class="card"><div class="gem">💎</div>
<section id="invite"><h1>Na, Gem? 😋</h1><p>Ich würde dich gerne ganz offiziell auf ein Date einladen.</p><p>Ich koche, du probierst und wenn's nicht schmeckt, bestellen wir Pizza. Deal? ❤️</p>
<button class="yes" onclick="showCal()">Ja, liebend gerne 🥰</button><button class="no" id="no" onclick="moveNo()">Korb 😅</button><p class="small">Der Koch ist übrigens bemüht. 😂</p></section>
<section id="cal" class="hidden"><h1>Sehr gute Entscheidung! 😌</h1><p>Such dir einen Tag aus – die Uhrzeit bestimmst du ganz entspannt. ❤️</p><div class="dates">
<button class="date" data-date="2026-11-07" onclick="pick(this)">Sa., 7. November</button><button class="date" data-date="2026-11-08" onclick="pick(this)">So., 8. November</button><button class="date" data-date="2026-11-20" onclick="pick(this)">Fr., 20. November</button><button class="date" data-date="2026-11-21" onclick="pick(this)">Sa., 21. November</button><button class="date" data-date="2026-11-22" onclick="pick(this)">So., 22. November</button></div>
<label for="time">Ungefähre Uhrzeit?</label><input id="time" type="time" value="17:00"><button class="yes" style="width:100%" onclick="send()">Das passt mir ❤️</button><div id="result" class="hidden"></div><button onclick="back()">Zurück</button></section></main>
<script>
let chosen="", noClicks=0;
function showCal(){invite.classList.add("hidden");cal.classList.remove("hidden")}
function back(){cal.classList.add("hidden");invite.classList.remove("hidden")}
function moveNo(){const b=document.getElementById("no");const lines=["Korb 😅","Knapp verfehlt 🙈","Nö, heute nicht 😂","Bist du sicher? 😇"];b.textContent=lines[noClicks%lines.length];noClicks++;b.style.transform=`translate(${Math.random()*130-65}px,${Math.random()*70-35}px)`}
function pick(b){chosen=b.dataset.date;document.querySelectorAll(".date").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}
function send(){const r=document.getElementById("result");if(!chosen){r.textContent="Erst einen Tag aussuchen 😋";r.classList.remove("hidden");return}const [y,m,d]=chosen.split("-").map(Number),dt=new Date(y,m-1,d),day=new Intl.DateTimeFormat("de-DE",{weekday:"long"}).format(dt),date=new Intl.DateTimeFormat("de-DE",{day:"numeric",month:"long",year:"numeric"}).format(dt),t=document.getElementById("time").value||"Uhrzeit noch offen";r.dataset.msg=`Ich bin dabei! 🥰 Mein Wunschtermin: ${day}, ${date}, ungefähr ${t} Uhr. ❤️`;r.innerHTML=`<b>Abgemacht? 💎</b><br>${day}, ${date}<br>Ca. ${t} Uhr<br><button class="yes" onclick="share()">Per WhatsApp schicken</button>`;r.classList.remove("hidden")}
async function share(){const t=document.getElementById("result").dataset.msg;if(navigator.share){try{await navigator.share({text:t});return}catch(e){}}window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}
</script></body></html>
